<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát Camera</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #333; }
        .camera-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img { max-width: 100%; border-radius: 4px; border: 2px solid #ddd; }
        .status { margin-top: 10px; color: #555; font-size: 14px; }
        .live-badge { color: red; font-weight: bold; animation: blink 1.5s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="camera-container">
        <h1>Bảng Điều Khiển Camera <span class="live-badge">● LIVE</span></h1>
        
        <!-- Nơi hiển thị ảnh -->
        <img id="cameraStream" src="" alt="Đang tải dữ liệu camera...">
        
        <div class="status" id="statusText">Đang kết nối tới máy chủ...</div>
    </div>

    <script>
        const imgElement = document.getElementById('cameraStream');
        const statusText = document.getElementById('statusText');
        let currentImageUrl = '';

        // Hàm gọi API lấy ảnh mới nhất
        async function fetchLatestImage() {
            try {
                const response = await fetch('/api/latest-image');
                const data = await response.json();

                if (data.imageUrl && data.imageUrl !== currentImageUrl) {
                    // Cập nhật ảnh mới (Thêm query ?t= để trình duyệt không bị cache ảnh cũ)
                    imgElement.src = data.imageUrl + '?t=' + new Date().getTime();
                    currentImageUrl = data.imageUrl;
                    
                    const timeString = new Date().toLocaleTimeString('vi-VN');
                    statusText.innerHTML = `Cập nhật lần cuối: <b>${timeString}</b>`;
                }
            } catch (error) {
                statusText.innerHTML = `<span style="color:red">Mất kết nối tới Server!</span>`;
            }
        }

        // Gọi ngay lập tức khi mở trang
        fetchLatestImage();

        // Thiết lập tự động lấy ảnh mới mỗi 5 giây (đồng bộ với tốc độ cắt ảnh của Python)
        setInterval(fetchLatestImage, 5000);
    </script>

</body>
</html>

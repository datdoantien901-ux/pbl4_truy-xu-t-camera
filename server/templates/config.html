{% extends '_layout.html' %}
{% block title %}Cấu hình thu nhận{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Cấu hình thu nhận</h1>
  </div>
</div>

<div class="config-grid single">
  <form id="f" class="panel config-form">
    <div class="setting">
      <div><label for="capture_interval">Tần suất chụp</label></div>
      <div class="with-unit"><input type="number" id="capture_interval" name="capture_interval" min="1" max="3600" required><span class="unit">giây</span></div>
    </div>
    <div class="setting">
      <div><label for="jpeg_quality">Chất lượng ảnh JPEG</label></div>
      <div class="range-row">
        <input type="range" id="jpeg_quality" name="jpeg_quality" min="10" max="100" step="5" required>
        <output id="qualityOut" for="jpeg_quality"></output>
      </div>
    </div>
    <div class="setting">
      <div><label for="resize_width">Chiều rộng ảnh</label></div>
      <div class="with-unit"><input type="number" id="resize_width" name="resize_width" min="160" max="3840" step="2" required><span class="unit">px</span></div>
    </div>
    <div class="setting">
      <div><label for="max_images">Số ảnh lưu tối đa trên server</label></div>
      <div class="with-unit"><input type="number" id="max_images" name="max_images" min="1" max="10000" required><span class="unit">ảnh</span></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Lưu cấu hình</button>
      <span class="muted" id="updated"></span>
    </div>
    <div class="toast" id="msg" role="status"></div>
  </form>

</div>

<h2 class="section-title">Lịch sử thay đổi</h2>
<div class="panel table-wrap">
  <table class="data">
    <thead><tr><th>Thời điểm</th><th>Tham số</th><th class="num">Giá trị cũ</th><th class="num">Giá trị mới</th><th>Người thay đổi</th></tr></thead>
    <tbody id="history"></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
const FIELDS = ['capture_interval', 'jpeg_quality', 'resize_width', 'max_images'];
const NAMES = {capture_interval: 'Tần suất chụp (giây)', jpeg_quality: 'Chất lượng JPEG',
               resize_width: 'Chiều rộng ảnh (px)', max_images: 'Số ảnh tối đa'};
const f = document.getElementById('f');
const msg = document.getElementById('msg');
const q = document.getElementById('jpeg_quality');
const qOut = document.getElementById('qualityOut');
q.addEventListener('input', () => qOut.textContent = q.value);

function showUpdated(c) { document.getElementById('updated').textContent = 'Cập nhật lần cuối ' + fmtTime(c.updated_at); }

async function load() {
  const c = await (await fetch('/api/config')).json();
  for (const k of FIELDS) f[k].value = c[k];
  qOut.textContent = q.value;
  showUpdated(c);
  loadHistory();
}

async function loadHistory() {
  const rows = await (await fetch('/api/config/history?limit=30')).json();
  const tb = document.getElementById('history');
  tb.replaceChildren();
  if (!rows.length)
    tb.append(el('tr', {}, el('td', {colspan: 5}, el('div', {class: 'empty'}, 'Chưa có thay đổi nào. Lưu cấu hình để bắt đầu ghi lịch sử.'))));
  for (const r of rows)
    tb.append(el('tr', {}, el('td', {}, fmtTime(r.changed_at)), el('td', {}, NAMES[r.field] || r.field),
                 el('td', {class: 'num'}, r.old_value), el('td', {class: 'num'}, r.new_value),
                 el('td', {}, r.changed_by || '—')));
}

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {};
  for (const k of FIELDS) body[k] = parseInt(f[k].value);
  const r = await fetch('/api/config', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  });
  const j = await r.json();
  if (r.ok) {
    msg.className = 'toast ok';
    msg.textContent = 'Đã lưu cấu hình. Client sẽ áp dụng trong khoảng 10 giây.';
    showUpdated(j);
  } else {
    msg.className = 'toast err';
    msg.textContent = 'Chưa lưu được: ' + (j.error || ('lỗi ' + r.status));
  }
  loadHistory();
});

load();
</script>
{% endblock %}

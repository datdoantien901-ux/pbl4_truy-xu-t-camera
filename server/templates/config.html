<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cấu hình Client</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>⚙️ Cấu hình thu nhận</h1>
  <nav><a href="/">Gallery</a><a href="/config">Cấu hình</a></nav>
</header>
<main>
  <form id="f">
    <label>Tần suất chụp (giây):
      <input type="number" name="capture_interval" min="1" max="3600">
    </label>
    <label>Chất lượng JPEG (10–100):
      <input type="number" name="jpeg_quality" min="10" max="100">
    </label>
    <label>Chiều rộng resize (px):
      <input type="number" name="resize_width" min="160" max="3840">
    </label>
    <label>Số ảnh lưu tối đa:
      <input type="number" name="max_images" min="1" max="10000">
      <small style="color:#666">(ảnh cũ nhất sẽ bị xóa khi vượt)</small>
    </label>
    <button type="submit">💾 Lưu cấu hình</button>
  </form>
  <p id="msg"></p>
</main>
<script>
async function load() {
  const r = await fetch('/api/config');
  const c = await r.json();
  const f = document.getElementById('f');
  f.capture_interval.value = c.capture_interval;
  f.jpeg_quality.value     = c.jpeg_quality;
  f.resize_width.value     = c.resize_width;
  f.max_images.value       = c.max_images;
  document.getElementById('msg').textContent = 'Cập nhật lần cuối: ' + c.updated_at;
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {
    capture_interval: parseInt(fd.get('capture_interval')),
    jpeg_quality:     parseInt(fd.get('jpeg_quality')),
    resize_width:     parseInt(fd.get('resize_width')),
    max_images:       parseInt(fd.get('max_images')),
  };
  const r = await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const j = await r.json();
  document.getElementById('msg').textContent =
    r.ok ? '✅ Đã lưu. Client sẽ áp dụng trong vòng polling tiếp theo.' : '❌ ' + (j.error || r.status);
});

load();
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — PBL4 Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="login-page">
  <form class="panel login-card" method="post" action="/login">
    <span class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8l13-4 2 6-13 4z"/><path d="M8 13l1 4H4"/><path d="M18 10l3 1"/></svg>
      </span>
      <span><span class="brand-name">PBL4 Camera</span><br><span class="brand-sub muted">Giám sát hình ảnh qua mạng</span></span>
    </span>
    <div>
      <h1>Đăng nhập</h1>
      <p class="muted">Dùng tài khoản do quản trị viên cấp.</p>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>Tên đăng nhập</span>
      <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label class="field"><span>Mật khẩu</span>
      <input type="password" name="password" autocomplete="current-password" required></label>
    {% if error %}<div class="toast err" role="alert">{{ error }}</div>{% endif %}
    <button class="btn btn-primary" type="submit">Đăng nhập</button>
  </form>
</main>
</body>
</html>
